name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build production image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing is a deployment concern and needs a registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: amin-khoddam-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --init -d --name portfolio -p 3000:3000 amin-khoddam-portfolio:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Health check passed"
              # Confirm the container's own HEALTHCHECK command agrees.
              docker exec portfolio node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"
              docker stop portfolio
              exit 0
            fi
            sleep 2
          done
          echo "Health check never succeeded"
          docker logs portfolio
          docker stop portfolio
          exit 1
